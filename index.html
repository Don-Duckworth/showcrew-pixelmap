<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#05080f">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PixelMap">
<meta name="application-name" content="ShowCrew PixelMap">
<meta name="description" content="ShowCrew Tools — pixel-space coordinates, guides, PiP boxes and PNG guide exports for event screens.">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/app.css">
<title>ShowCrew PixelMap</title>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><rect x="6" y="14" width="52" height="36" rx="3" fill="none" stroke="#00e5ff" stroke-width="3"/><path d="M32 18v28M10 32h44" stroke="#00e5ff" stroke-width="1.6" opacity=".7"/><circle cx="32" cy="32" r="6" fill="none" stroke="#00e5ff" stroke-width="2.4"/><rect x="38" y="20" width="14" height="9" fill="none" stroke="#ff3df2" stroke-width="2.4"/></svg>
    <div><div class="brand-sub">SHOWCREW TOOLS</div><div class="brand-main">PIXEL<span>MAP</span></div></div>
  </div>
  <button id="jobBtn" class="jobbtn" data-act="openJobs"><span class="lbl">JOB</span><span class="jobname">—</span><span class="jobmeta"></span><span class="caret">▾</span></button>
  <div id="modeSeg" class="seg" role="group" aria-label="Coordinate mode">
    <button data-mode="screen">Per screen</button><button data-mode="global">Global canvas</button>
  </div>
</header>
<main id="app">
  <aside id="screens" class="pane"></aside>
  <section id="stage" class="pane">
    <div id="chips" class="chips"></div>
    <div id="canvasWrap"><canvas id="cv"></canvas></div>
    <div id="status" class="status"></div>
  </section>
  <section id="panel" class="pane">
    <nav id="tabs" class="tabs"></nav>
    <div id="panelBody" class="panel-body"></div>
  </section>
</main>
<div id="modal" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
